services:
  - type: web
    name: sofia-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NEWS_API_KEY
        sync: false
      # Secret shared between the Render backend and the Desktop Agent.
      # Generate: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SOFIA_AGENT_TOKEN
        sync: false
      # Optional: if you run Ollama on a tunnelled server instead of locally.
      # Leave unset when the agent handles all LLM calls.
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: qwen2.5:7b-instruct
